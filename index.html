<!DOCTYPE html>
<html lang="es" data-tema="mixto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Entreno</title>
<meta name="description" content="Entreno y comida. Funciona sin conexión.">
<meta name="theme-color" content="#2A2A30">
<script>
  // El aspecto elegido se pone antes de pintar nada, para que no parpadee al abrir.
  // tema-v2: una sola vez, pasa a «Lavanda y rosa», que es lo que Rocío pidió el 10 sep.
  try {
    if (!localStorage.getItem('tema-v2')) { localStorage.setItem('tema', 'mixto'); localStorage.setItem('tema-v2', '1'); }
    document.documentElement.dataset.tema = localStorage.getItem('tema') || 'mixto';
  } catch (e) { /* por defecto */ }
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icono-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
